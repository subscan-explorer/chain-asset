name: Asset request review
run-name: Asset review · ${{ github.event_name }} · issue ${{ github.event.issue.number || inputs.issue_number || 'backlog' }}

on:
  # Preserve the former AIP fallback's 00:00/12:00 Asia/Shanghai cadence.
  schedule:
    - cron: '0 4,16 * * *'
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number (empty scans the pending backlog)
        type: string
        required: false
      dry_run:
        description: Verify without posting comments or creating an Asset PR
        type: boolean
        default: true
      force:
        description: Maintainer override of cooldown and completed-input deduplication
        type: boolean
        default: false
      connectivity_check:
        description: Check hook completion only; always read-only, does not review the Asset
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  review:
    if: >-
      github.repository == 'subscan-explorer/chain-asset' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.ASSET_REVIEW_ENABLED == 'true') &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       (!github.event.issue.pull_request && github.event.sender.type != 'Bot' &&
        github.event.sender.id == github.event.issue.user.id &&
        (github.event_name != 'issue_comment' ||
         (github.event.comment.user.id == github.event.issue.user.id &&
          contains(github.event.comment.body, '/asset-review') &&
          !((github.event.sender.login == vars.CHAIN_ASSET_AGENT_LOGIN ||
             contains(fromJSON(vars.CHAIN_ASSET_LEGACY_REVIEWERS || '[]'), github.event.sender.login)) &&
            contains(github.event.comment.body, '<!-- chain-asset-review:v1 '))))))
    runs-on: ubuntu-latest
    # Rejected comments never acquire this lock or evict a pending owner request.
    # Hold it through terminal status and queue eligible events without replacing them.
    concurrency:
      group: chain-asset-review
      cancel-in-progress: false
      queue: max
    # Allow the 30-minute cooldown plus the bounded review and stop acknowledgement.
    timeout-minutes: 70
    environment: chain-assets
    env:
      GH_READ_TOKEN: ${{ github.token }}
      REVIEWER_LOGIN: ${{ vars.CHAIN_ASSET_AGENT_LOGIN }}
      LEGACY_REVIEWER_LOGINS: ${{ vars.CHAIN_ASSET_LEGACY_REVIEWERS || '[]' }}
      REVIEW_COOLDOWN_SECONDS: '1800'
      REVIEW_STATE_DIR: asset-review-state
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test trigger gates and event parsing
        run: python3 -m unittest discover -s tests -p 'test_asset_review*.py' -v
      - name: Resolve current input, cooldown and unfinished runs
        id: prepare
        run: python3 scripts/asset_review.py prepare
      - name: Persist recovery state before sending any request
        if: steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-review-state
          path: asset-review-state/state.json
          retention-days: 90
          if-no-files-found: error
      - name: Review and wait for terminal execution status
        if: steps.prepare.outputs.dispatch == 'true'
        env:
          HAST_AGENT_URL: ${{ secrets.HAST_ASSET_AGENT_HOOK_URL }}
        run: python3 scripts/asset_review.py execute
      - name: Persist review outcome and safe diagnostics
        if: always() && steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-review-state
          path: asset-review-state/state.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Save safe event diagnostics
        if: always() && steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-review-diagnostics
          path: asset-review-state/diagnostics.json
          retention-days: 14
          if-no-files-found: ignore
