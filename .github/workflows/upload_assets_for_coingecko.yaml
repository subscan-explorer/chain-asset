name: Upload Assets
on: []
  # push:
  #   branches: ["main"]
  #   paths:
  #     - assets/**
  #     - .github/actions/merge_coingecko/**
  #     - .github/workflows/upload_assets_for_coingecko.yaml

concurrency:
  group: chain-asset-config-repo
  cancel-in-progress: false

jobs:
  upload-assets:
    name: Upload Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clone Config Repo
        if: success()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ./${{ secrets.CONFIG_REPO_NAME }}
          repository: ${{ secrets.CONFIG_REPO_OWNER }}/${{ secrets.CONFIG_REPO_NAME }}
          ref: ${{ secrets.CONFIG_BRANCH }}
          token: ${{ secrets.CONFIG_GITHUB_TOKEN }}

      - name: Merge JSON
        id: merge_coingecko
        uses: ./.github/actions/merge_coingecko
        with:
          coingecko_token: ${{ secrets.COINGECKO_API_KEY }}
          assets_dir: ./assets
          base_coingecko_json_path: ./kubernetes-manifests/subscan/networks/coingecko-token.json
      - name: echo json filename
        env:
          SOURCE_JSON: ${{ steps.merge_coingecko.outputs.json_filename }}
        run: |
          cat -- "$SOURCE_JSON"


      - name: Check Config Change
        if: success()
        id: check_config_change
        env:
          SOURCE_JSON: ${{ steps.merge_coingecko.outputs.json_filename }}
          DEST_JSON: ./${{ secrets.CONFIG_REPO_NAME }}/subscan/networks/coingecko-token-auto-generated.json
        run: |
          SOURCE_MD5=$(md5sum < "$SOURCE_JSON")
          DEST_MD5=""
          if [ -f "$DEST_JSON" ]; then
            DEST_MD5=$(md5sum < "$DEST_JSON")
          fi
          if [ "$SOURCE_MD5" = "$DEST_MD5" ]; then
              echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
              echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Move json to config repo
        if: steps.check_config_change.outputs.skip_commit == 'false' && success()
        env:
          SOURCE_JSON: ${{ steps.merge_coingecko.outputs.json_filename }}
          DEST_JSON: ./${{ secrets.CONFIG_REPO_NAME }}/subscan/networks/coingecko-token-auto-generated.json
        run: |
          mv -- "$SOURCE_JSON" "$DEST_JSON"
      - name: Commit and push
        if: steps.check_config_change.outputs.skip_commit == 'false' && success()
        env:
          CONFIG_REPO_PATH: ./${{ secrets.CONFIG_REPO_NAME }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          cd -- "$CONFIG_REPO_PATH"
          git add subscan/networks/coingecko-token-auto-generated.json
          git commit -m '[Automated] Update coingecko-token-auto-generated.json' && git push
